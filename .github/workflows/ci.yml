name: CI

on:
  push:
    branches: [main, development]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'        # real semver, e.g. v0.1.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'      # prereleases, e.g. v0.2.0-rc1
  pull_request:
    branches: [main, development]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check ferrolabsai/ tests/ && ruff format --check ferrolabsai/ tests/

      - name: Type check
        run: mypy ferrolabsai/

      - name: Run tests
        run: pytest tests/ -v --tb=short

  contract:
    name: Contract vs AI Gateway ${{ matrix.label }}
    runs-on: ubuntu-latest
    # The pinned leg is the required signal; "main" moves upstream of this
    # repo, so a failure there must only report drift, never block a merge or
    # a tagged release.
    continue-on-error: ${{ matrix.gateway_ref == 'main' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The pin is the commit SHA behind the tag so a moved tag cannot change
          # what a release is verified against; `label` keeps the check name
          # stable ("Contract vs AI Gateway v1.4.5"), which the publish job and
          # the branch protection rules reference.
          - gateway_ref: e8e4e26ddbd1dcf734722d82f02fabb50ce50037  # v1.4.5
            label: v1.4.5
          - gateway_ref: main
            label: main
    steps:
      - name: Check out ferrolabs-python-sdk
        uses: actions/checkout@v4
        with:
          path: ferrolabs-python-sdk
          persist-credentials: false
      - name: Check out AI Gateway
        uses: actions/checkout@v4
        with:
          repository: ferro-labs/ai-gateway
          ref: ${{ matrix.gateway_ref }}
          path: ai-gateway
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: ai-gateway/go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the SDK
        run: pip install -e ".[dev]"
        working-directory: ferrolabs-python-sdk
      - name: Boot the gateway and run the contract suite
        run: ./scripts/with-gateway.sh
        working-directory: ferrolabs-python-sdk
        env:
          FERRO_GATEWAY_SOURCE: ${{ github.workspace }}/ai-gateway

  publish:
    name: Publish to PyPI
    # A release must pass the unit matrix and the pinned-gateway contract leg.
    needs: [test, contract]
    runs-on: ubuntu-latest
    # Only run on semver tag pushes (see `on.push.tags` above).
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/ferrolabsai/

    # Prevent two concurrent publishes of the same tag from racing.
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false

    permissions:
      id-token: write   # OIDC trusted publishing to PyPI — no API key needed
      contents: write   # softprops/action-gh-release needs this to create the Release

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Assert tag matches pyproject.toml version
        run: |
          python <<'PY'
          import os, sys, tomllib
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              print(f"::error::Tag {tag!r} does not match pyproject.toml version {expected!r}")
              sys.exit(1)
          print(f"Tag {tag} matches pyproject.toml {expected}")
          PY

      - name: Install build tools
        run: pip install build

      - name: Build
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
